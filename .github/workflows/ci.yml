name: Sepsis Bundle Timer CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest

    - name: Test browser scripts
      run: |
        node --check web/app.js
        node --check web/timing.js
        node --test web/timing.test.cjs

    - name: Check static asset references
      run: |
        python -c "from pathlib import Path; page=Path('web/index.html').read_text(); assert all((Path('web')/p).is_file() for p in ('timing.js','app.js','styles.css')); assert 'fetch(' not in Path('web/app.js').read_text(); assert 'simulated' not in page.lower()"

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
